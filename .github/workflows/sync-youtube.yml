name: Sync YouTube videos

on:
  schedule:
    # Run hourly at :00, staggered from Substack (:30) and Instagram (06:00 UTC)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Write videos.json snapshot (uncheck for dry run)'
        type: boolean
        default: true
  repository_dispatch:
    types: [content-published]

concurrency:
  group: content-sync-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Fetch long-form YouTube uploads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter hey-this-is-andrew... --filter .

      - name: Run YouTube sync tests
        run: pnpm --filter hey-this-is-andrew test

      - name: Sync YouTube videos
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.execute }}" = "false" ]; then
            pnpm --filter hey-this-is-andrew sync:youtube
          else
            pnpm --filter hey-this-is-andrew sync:youtube --execute
          fi

      - name: Commit and push updated videos
        if: github.event_name != 'workflow_dispatch' || inputs.execute
        env:
          SYNC_BRANCH: ${{ github.ref_name }}
        run: |
          git add sites/hey-this-is-andrew/src/data/videos.json
          if git diff --cached --quiet; then
            echo "No YouTube video changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(youtube): sync latest YouTube videos"
          git pull --rebase origin "$SYNC_BRANCH"
          git push origin "HEAD:$SYNC_BRANCH"
