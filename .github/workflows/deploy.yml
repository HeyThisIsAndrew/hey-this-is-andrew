name: Deploy to GitHub Pages

# Builds sites/hey-this-is-andrew from the andrew-sites workspace and
# publishes it to GitHub Pages. Runs on pushes to main and by hand only;
# feature branches never deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/hey-this-is-andrew
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .
      # Self-host the "Shot on the Job" photos (Capture Create Caffeinate's
      # Instagram) before the build: the page only ever shows files under
      # src/assets/instagram/ (never a signed, expiring Instagram CDN URL).
      # Non-fatal by design: without the token it uses the cached URLs.
      - name: Sync Instagram photos
        run: pnpm run sync:instagram
        env:
          CCC_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CCC_INSTAGRAM_ACCESS_TOKEN }}
          CCC_INSTAGRAM_USER_ID: ${{ secrets.CCC_INSTAGRAM_USER_ID }}
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Check the built site
        run: pnpm run test:dist
        env:
          ASTRO_BASE: /hey-this-is-andrew/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./sites/hey-this-is-andrew/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
