name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync Instagram photos
        run: pnpm --filter hey-this-is-andrew run sync:instagram
        env:
          CCC_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CCC_INSTAGRAM_ACCESS_TOKEN }}
          CCC_INSTAGRAM_USER_ID: ${{ secrets.CCC_INSTAGRAM_USER_ID }}
      - name: Workspace checks
        run: pnpm --filter hey-this-is-andrew check
      - name: Unit tests
        run: pnpm -r --if-present test
      - name: Build site
        run: pnpm --filter hey-this-is-andrew build
        env:
          ASTRO_BASE: /hey-this-is-andrew/
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Build starter
        run: pnpm --filter site-starter build
      - name: Check the built site
        run: pnpm --filter hey-this-is-andrew exec node scripts/audit-dist.mjs
        env:
          ASTRO_BASE: /hey-this-is-andrew/
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: pnpm exec playwright test
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./sites/hey-this-is-andrew/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
