# ─── PRODUCTION DEPLOY: build each site, deploy it, and PROVE it went live ───
#
# Same shape as BE Unconventional HQ's deploy.yml, once per site. Every site
# whose package.json has a "cloudflare" block is its own Worker
# (scripts/cloudflare.mjs). For each affected site this:
#   1. asks production which commit it serves (<meta name="build-sha"> from
#      @andrew/ui ChromeMeta) and skips the site if that is main's HEAD, or an
#      older commit with nothing the site builds from changed since;
#   2. installs only that site and its workspace packages, builds it with
#      PUBLIC_BUILD_SHA stamped in, and deploys it (secrets ride along with
#      the new version, never via `secret put`);
#   3. fetches the Worker's workers.dev address until it serves that commit,
#      and FAILS if it never does (a failed run emails the repo owner). A
#      custom domain gets one informational probe (404 = not on this Worker).
#
# WHEN IT RUNS
#   - every push to main (the sites the push affects; see `pnpm cf changed`);
#   - after each content-sync workflow succeeds. Those push with GITHUB_TOKEN,
#     and a GITHUB_TOKEN push does NOT trigger `on: push`, so workflow_run is
#     how their commits reach Cloudflare. Add new sync workflows' names below;
#   - by hand: Actions > Deploy to Cloudflare > Run workflow (one site or
#     "all"; tick force to redeploy what production already serves).
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers
# template). Without it the workflow skips with a notice instead of failing.
# Worker secrets a site lists in its cloudflare block (e.g. RESEND_API_KEY)
# are uploaded from repository secrets of the same name when they exist.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Sync Instagram Media
      - Sync Substack articles
      - Sync Substack Articles
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: 'Site folder under sites/, or "all"'
        required: true
        default: all
      force:
        description: Deploy even if production already serves main's HEAD
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Pick sites
    runs-on: ubuntu-latest
    # A content sync that failed pushed nothing new.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      sites: ${{ steps.pick.outputs.sites }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      # Always main's current HEAD: a sync may have pushed again since.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: pick
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          INPUT_SITE: ${{ github.event.inputs.site }}
          BEFORE: ${{ github.event.before }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping Cloudflare deploys. See CLOUDFLARE.md."
            echo 'sites=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GITHUB_EVENT_NAME" in
            push)
              sites=$(node scripts/cloudflare.mjs changed "$BEFORE" HEAD) ;;
            workflow_dispatch)
              if [ "$INPUT_SITE" = "all" ]; then sites=$(node scripts/cloudflare.mjs changed)
              else sites=$(node -e 'console.log(JSON.stringify([process.argv[1]]))' "$INPUT_SITE"); fi ;;
            *)
              # workflow_run: every site; each job skips itself when
              # production is already current for it.
              sites=$(node scripts/cloudflare.mjs changed) ;;
          esac
          echo "Candidates: $sites"
          echo "sites=$sites" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.site }}
    needs: plan
    if: needs.plan.outputs.sites != '[]' && needs.plan.outputs.sites != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.plan.outputs.sites) }}
    # One deploy per site at a time; a newer run waits rather than racing.
    concurrency:
      group: cloudflare-production-${{ matrix.site }}
      cancel-in-progress: false
    env:
      SITE: ${{ matrix.site }}
      SHA: ${{ needs.plan.outputs.sha }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Is production already current?
        id: live
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          echo "pkg=$(node scripts/cloudflare.mjs info "$SITE" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0)).pkgName)')" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ]; then
            echo "Forced: deploying $SHA."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEEDED=$(node scripts/cloudflare.mjs needs-deploy "$SITE" "$SHA")
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"
          [ "$NEEDED" = "false" ] && echo "::notice::$SITE: production is already current. Nothing to deploy."
          true

      - uses: pnpm/action-setup@v4
        if: steps.live.outputs.needed == 'true'
      - uses: actions/setup-node@v4
        if: steps.live.outputs.needed == 'true'
        with:
          node-version: 22
          cache: pnpm

      # Only this site, the workspace packages it uses, and the root (wrangler).
      - name: Install (this site only)
        if: steps.live.outputs.needed == 'true'
        env:
          PKG: ${{ steps.live.outputs.pkg }}
        run: pnpm install --frozen-lockfile --filter "${PKG}..." --filter .

      - name: Build and deploy
        if: steps.live.outputs.needed == 'true'
        env:
          PUBLIC_BUILD_SHA: ${{ needs.plan.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: node scripts/cloudflare.mjs deploy "$SITE"

      # The check HQ added after a deploy silently did not land: the Worker
      # must serve THIS commit (read from workers.dev, not a bot-protected domain).
      - name: Verify production serves this commit
        if: steps.live.outputs.needed == 'true'
        run: node scripts/cloudflare.mjs verify "$SITE" "$SHA"
