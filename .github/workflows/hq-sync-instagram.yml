# Automated Instagram -> instagram.json + public/instagram/ sync.
#
# WHY THIS WORKFLOW EXISTS AT ALL
# It did not, and that was the gap. META_ACCESS_TOKEN has been configured as a
# repository secret for a long time — sync-media-kit.yml uses it — but nothing
# ever ran the Instagram CONTENT sync with it. The only thing that did was a
# tail-end of `pnpm --filter beunconventionalhq sync` inside sync-youtube.yml, a job holding only
# YOUTUBE_* secrets, where it could not authenticate and simply failed the run
# (exit 9, 2026-08-14). So the feed was only ever refreshed by hand.
#
# NO SEPARATE INSTAGRAM TOKEN IS NEEDED. The sync authenticates to the Meta
# Graph API and walks me/accounts -> the linked Page -> its
# instagram_business_account -> media. The same META_ACCESS_TOKEN covers both
# products; that is why the sync-media-kit job can already read Instagram
# figures with it.
#
# WHY THIS COMMITS IMAGE FILES, NOT JUST JSON
# Instagram's CDN URLs are signed and expire in a couple of days. Storing them
# meant the whole rail went dead on a fixed schedule — reported from production
# with 188 of 188 stored URLs already expired. scripts/sync-instagram.mjs now
# downloads each image into public/instagram/, so the feed keeps working
# whatever Instagram does to its signatures afterwards, and the tiles stop
# going through /api/proxy on every render.
#
# CADENCE: every 6 hours, on the owner's call ("a couple times a day, or at
# least once every six hours"). Offset by 15 minutes from sync-youtube.yml and
# sync-articles.yml, which both run at :00, so three jobs are not competing for
# a runner and a rebuild at the same instant.
#
# THE API IS NOT THE CONSTRAINT. A run makes exactly THREE Graph API calls —
# me/accounts, the Page's instagram_business_account field, and one media list
# — so four runs a day is 12 calls against a ceiling measured in hundreds per
# hour. There is no rate-limit risk at this cadence or several times it.
#
# WHAT IS CONSTRAINED is Cloudflare build minutes, and this cadence would have
# burned them badly without two changes made alongside it:
#
#   1. Images already on disk are not re-downloaded. The media behind a post id
#      never changes — only the URL's signature rotates — so a run fetches only
#      genuinely new posts instead of all 50 every time.
#   2. src/data/instagram.json is only rewritten when something other than a
#      URL signature moved. Instagram re-signs on every fetch, so a naive sync
#      produces a diff every run, which means a commit and a rebuild four times
#      a day for no content change at all.
#
# Together those make a quiet run cost three API calls and produce no commit.
#
# INERT UNTIL CONFIGURED: if META_ACCESS_TOKEN is absent the job logs a skip
# and exits green, matching sync-youtube.yml and daily-rebuild.yml.
name: Sync Instagram feed

on:
  schedule:
    - cron: '15 */6 * * *' # Every 6 hours, offset 15m from the other syncs
  workflow_dispatch:
    inputs:
      execute:
        description: 'Write instagram.json and download images (uncheck for a dry-run preview only)'
        type: boolean
        default: true

# ── SERIALISED AGAINST THE OTHER CONTENT SYNCS ───────────────────────────────
# Five workflows commit and push to main. Two of them fired on the same cron
# minute, so whichever finished second pushed onto a ref that had moved and
# failed — a red run that had nothing to do with the sync itself.
#
# The cron times are now staggered (:00 youtube, :15 instagram, :30 articles),
# which handles the scheduled case. This shared group handles everything the
# schedule cannot: a run that overruns its slot, two workflow_dispatch clicks,
# or a weekly job landing on top of a six-hourly one.
#
# ONE group name across all five is the point — concurrency only serialises
# runs that share a group, and the resource being contended is main itself.
# cancel-in-progress is false deliberately: these jobs push commits, and
# cancelling one mid-push is how you get a partial sync, not a fast one.
concurrency:
  group: content-sync-push
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check secrets configured
        id: check
        env:
          HAS_META: ${{ secrets.META_ACCESS_TOKEN != '' }}
        run: |
          if [ "$HAS_META" != "true" ]; then
            echo "META_ACCESS_TOKEN not configured — skipping (see workflow header to activate)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run sync
        if: steps.check.outputs.configured == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        # `sync:instagram`, not `sync` — the YouTube sync has its own workflow
        # and its own credentials, and coupling the two is what turned a
        # missing token into a failed YouTube run.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.execute }}" = "false" ]; then
            pnpm --filter beunconventionalhq sync:instagram
          else
            pnpm --filter beunconventionalhq sync:instagram -- --execute
          fi

      - name: Commit and push if the feed changed
        if: steps.check.outputs.configured == 'true'
        run: |
          # BOTH paths. The JSON references files in public/instagram/ by path,
          # so committing one without the other ships a feed pointing at images
          # that are not in the repo.
          if git diff --quiet -- src/data/instagram.json public/instagram && \
             [ -z "$(git status --porcelain -- public/instagram)" ]; then
            echo "No changes — nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/instagram.json public/instagram
          git commit -m "chore: automated Instagram sync" -m "Synced by the sync-instagram.yml workflow (run ${{ github.run_id }})."
          git pull origin HEAD --rebase && git push origin HEAD:${{ github.ref }}
