name: CI Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workspace checks & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace checks
        run: pnpm --filter hey-this-is-andrew check
      - name: Build Reelay preview
        run: pnpm --filter reelay build
        env:
          BASE_PATH: /hey-this-is-andrew/reelay/
          SITE_URL: https://heythisisandrew.github.io
          REELAY_NOINDEX: '1'
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Unit tests
        run: pnpm -r --if-present test
        env:
          BASE_PATH: /hey-this-is-andrew/reelay/
      - name: Build site
        run: pnpm --filter hey-this-is-andrew build
        env:
          ASTRO_BASE: /hey-this-is-andrew/
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Check the built site
        run: pnpm --filter hey-this-is-andrew exec node scripts/audit-dist.mjs
        env:
          ASTRO_BASE: /hey-this-is-andrew/

  e2e:
    name: Playwright E2E suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm --filter hey-this-is-andrew build
        env:
          ASTRO_BASE: /hey-this-is-andrew/
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run Playwright E2E tests
        run: pnpm exec playwright test
