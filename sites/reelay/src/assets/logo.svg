<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 34" fill="none" aria-label="Reelay Studio">
  <!-- Minimalist Cinema Reel Mark -->
  <rect x="1" y="1" width="32" height="32" rx="7" fill="#14151a" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="17" cy="17" r="9.5" stroke="#e5a93c" stroke-width="2" stroke-linecap="round" stroke-dasharray="11 4"/>
  <circle cx="17" cy="17" r="3.5" fill="#f5f5f5"/>
  <polygon points="16,14 19.5,17 16,20" fill="#090a0d"/>
  
  <!-- Wordmark: Apple Pro Precision Typography -->
  <text x="44" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="-0.03em">REELAY</text>
  <text x="134" y="22" fill="#e5a93c" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif" font-weight="600" font-size="9" letter-spacing="0.16em">STUDIO</text>
