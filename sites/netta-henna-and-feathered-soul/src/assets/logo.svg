<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 54" width="320" height="54" aria-label="Netta Henna and Feathered Soul">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cormorant+Garamond:wght@600&amp;display=swap');
      .logo-script { font-family: 'Great Vibes', cursive; font-size: 28px; fill: #332219; }
      .logo-sub { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 10.5px; fill: #c86446; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
    </style>
  </defs>
  <!-- Soft warm pill backing with breathing room -->
  <rect x="1" y="1" width="318" height="52" rx="26" fill="#faf5ee" stroke="rgba(200, 100, 70, 0.25)" stroke-width="1" />
  <!-- Feather / crescent motif accent -->
  <circle cx="30" cy="27" r="16" fill="#f4ebd9" stroke="#c86446" stroke-width="1.2" />
  <path d="M24 33 C25 25 32 20 36 17 C34 23 31 29 24 33 Z" fill="#c86446" opacity="0.9" />
  <path d="M24 33 L33 22" stroke="#faf5ee" stroke-width="1" stroke-linecap="round" />
  <!-- Text lockup -->
  <text x="56" y="31" class="logo-script">Netta Henna</text>
  <text x="56" y="44" class="logo-sub">&amp; Feathered Soul</text>
</svg>
